[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-intaker"
version = "1.1.0"
description = "A self-contained Podman web application with a GUI for inspecting, wiping, testing, firmware checking, benchmarking, and grading enterprise SSDs on Linux."
readme = "README.md"
authors = [
    { name = "Eowerd24", email = "saxlund.jakub@gmail.com" }
]
license = { text = "MIT" }
keywords = ["ssd", "storage", "smartctl", "fio", "proxmox", "podman", "fastapi", "nvme", "sata", "qualification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.2",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Eowerd24/Drive-Intaker"
Repository = "https://github.com/Eowerd24/Drive-Intaker"
Issues = "https://github.com/Eowerd24/Drive-Intaker/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["templates/*", "static/*", "static/**/*"]
